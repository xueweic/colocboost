[workspace]
name = "colocboost-ci"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[system-requirements]
libc = { family = "glibc", version = "2.17" }

[dependencies]
python = "3.12.*"
pyyaml = "*"
jsonschema = "*"
pytest = "*"

[target.linux-64.dependencies]
jq = "*"
coreutils = "*"

[target.linux-aarch64.dependencies]
jq = "*"
coreutils = "*"

[target.osx-64.dependencies]
jq = "*"
coreutils = "*"

[target.osx-arm64.dependencies]
jq = "*"
coreutils = "*"

[tasks.ci-validate]
cmd = "python .github/ci/validate_manifest.py .github/ci/check-matrix.yml"
cwd = "."

[tasks.ci-contract-tests]
cmd = "python -B .github/ci/run-contract-tests.py"
cwd = "."
env = { PYTHONDONTWRITEBYTECODE = "1" }

[tasks.ci-prepare]
cmd = '''python .github/ci/artifact_contract.py create --tarball='{{ tarball | replace("'", "'\"'\"'") }}' --metadata='{{ metadata | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["tarball", "metadata", "source_sha", "event_sha"]

[tasks.ci-prepare-source]
cmd = '''python -B .github/ci/prepare_source.py --repository='{{ repository | replace("'", "'\"'\"'") }}' --output-dir='{{ output_dir | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --github-output='{{ github_output | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["repository", "output_dir", "event_sha", "github_output"]
env = { LC_ALL = "C", R_ENVIRON_USER = "/dev/null", R_PROFILE_USER = "/dev/null", R_LIBS_USER = "$CONDA_PREFIX/lib/R/library" }

[tasks.ci-verify-source]
cmd = '''python -B .github/ci/verify_source.py --source-dir='{{ source_dir | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --github-output='{{ github_output | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["source_dir", "source_sha", "event_sha", "github_output"]

[tasks.ci-applicability]
cmd = '''python -B .github/ci/check_applicability.py --tarball='{{ tarball | replace("'", "'\"'\"'") }}' --metadata='{{ metadata | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --output='{{ output | replace("'", "'\"'\"'") }}' --rule='{{ rule | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["tarball", "metadata", "source_sha", "event_sha", "environment_id", "output", "rule"]

[tasks.ci-extract-source]
cmd = '''python -B .github/ci/extract_source.py --tarball='{{ tarball | replace("'", "'\"'\"'") }}' --metadata='{{ metadata | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --destination='{{ destination | replace("'", "'\"'\"'") }}' --github-output='{{ github_output | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["tarball", "metadata", "source_sha", "event_sha", "destination", "github_output"]

[tasks.ci-r-dependencies]
cmd = '''python -B .github/ci/run_r_helper.py --r-executable='{{ r_executable | replace("'", "'\"'\"'") }}' --helper=prepare-rhub-dependencies -- --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --tarball='{{ tarball | replace("'", "'\"'\"'") }}' --library='{{ library | replace("'", "'\"'\"'") }}' --evidence='{{ evidence | replace("'", "'\"'\"'") }}' --install-package='{{ install_package | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["r_executable", "environment_id", "tarball", "library", "evidence", "install_package"]
env = { LC_ALL = "C", R_ENVIRON_USER = "{% if pixi.is_win %}NUL{% else %}/dev/null{% endif %}", R_PROFILE_USER = "{% if pixi.is_win %}NUL{% else %}/dev/null{% endif %}" }

[tasks.ci-verify-dependencies]
cmd = '''python -B .github/ci/verify_dependency_evidence.py --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --evidence='{{ evidence | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["environment_id", "evidence"]

[tasks.ci-full-dependencies]
cmd = '''python -B .github/ci/run_r_helper.py --r-executable='{{ r_executable | replace("'", "'\"'\"'") }}' --helper=prepare-full-dependencies -- --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --purpose='{{ purpose | replace("'", "'\"'\"'") }}' --tarball='{{ tarball | replace("'", "'\"'\"'") }}' --library='{{ library | replace("'", "'\"'\"'") }}' --evidence='{{ evidence | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --tarball-sha256='{{ tarball_sha256 | replace("'", "'\"'\"'") }}' --r-executable='{{ r_executable | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["r_executable", "environment_id", "purpose", "tarball", "library", "evidence", "source_sha", "event_sha", "tarball_sha256"]
env = { LC_ALL = "C", R_ENVIRON_USER = "{% if pixi.is_win %}NUL{% else %}/dev/null{% endif %}", R_PROFILE_USER = "{% if pixi.is_win %}NUL{% else %}/dev/null{% endif %}" }

[tasks.ci-verify-full-dependencies]
cmd = '''python -B .github/ci/verify_full_dependencies.py --manifest=.github/ci/check-matrix.yml --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --purpose='{{ purpose | replace("'", "'\"'\"'") }}' --evidence='{{ evidence | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --tarball-sha256='{{ tarball_sha256 | replace("'", "'\"'\"'") }}' --r-executable='{{ r_executable | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["environment_id", "purpose", "evidence", "source_sha", "event_sha", "tarball_sha256", "r_executable"]

[tasks.ci-probe-runtime]
cmd = '''python -B .github/ci/run_r_helper.py --r-executable='{{ r_executable | replace("'", "'\"'\"'") }}' --helper=probe-runtime -- --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --runtime-profile='{{ runtime_profile | replace("'", "'\"'\"'") }}' --r-executable='{{ r_executable | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --tarball-sha256='{{ tarball_sha256 | replace("'", "'\"'\"'") }}' --evidence='{{ evidence | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["r_executable", "environment_id", "runtime_profile", "source_sha", "event_sha", "tarball_sha256", "evidence"]
env = { LC_ALL = "C", R_ENVIRON_USER = "{% if pixi.is_win %}NUL{% else %}/dev/null{% endif %}", R_PROFILE_USER = "{% if pixi.is_win %}NUL{% else %}/dev/null{% endif %}" }

[tasks.ci-verify-runtime]
cmd = '''python -B .github/ci/verify_runtime_evidence.py --manifest=.github/ci/check-matrix.yml --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --evidence='{{ evidence | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --tarball-sha256='{{ tarball_sha256 | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["environment_id", "evidence", "source_sha", "event_sha", "tarball_sha256"]

[tasks.ci-platform-r]
cmd = '''python -B .github/ci/verify_platform_r.py --manifest=.github/ci/check-matrix.yml --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --r-executable='{{ r_executable | replace("'", "'\"'\"'") }}' --selected-selector='{{ selected_selector | replace("'", "'\"'\"'") }}' --setup-r-version='{{ setup_r_version | replace("'", "'\"'\"'") }}' --runner-label='{{ runner_label | replace("'", "'\"'\"'") }}' --evidence='{{ evidence | replace("'", "'\"'\"'") }}' --github-output='{{ github_output | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["environment_id", "r_executable", "selected_selector", "setup_r_version", "runner_label", "evidence", "github_output"]

[tasks.ci-r-binary-check]
cmd = '''python -B .github/ci/run_r_binary_check.py --manifest=.github/ci/check-matrix.yml --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --r-executable='{{ r_executable | replace("'", "'\"'\"'") }}' --tarball='{{ tarball | replace("'", "'\"'\"'") }}' --metadata='{{ metadata | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --work-dir='{{ work_dir | replace("'", "'\"'\"'") }}' --check-library='{{ check_library | replace("'", "'\"'\"'") }}' --evidence='{{ evidence | replace("'", "'\"'\"'") }}' --log='{{ log | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["environment_id", "r_executable", "tarball", "metadata", "source_sha", "event_sha", "work_dir", "check_library", "evidence", "log"]

[tasks.ci-special-check]
cmd = '''python -B .github/ci/verify_special_check.py --manifest=.github/ci/check-matrix.yml --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --profile='{{ profile | replace("'", "'\"'\"'") }}' --check-root='{{ check_root | replace("'", "'\"'\"'") }}' --native-evidence='{{ native_evidence | replace("'", "'\"'\"'") }}' --runtime-evidence='{{ runtime_evidence | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --tarball-sha256='{{ tarball_sha256 | replace("'", "'\"'\"'") }}' --output='{{ output | replace("'", "'\"'\"'") }}' --github-output='{{ github_output | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["environment_id", "profile", "check_root", "native_evidence", "runtime_evidence", "source_sha", "event_sha", "tarball_sha256", "output", "github_output"]

[tasks.ci-file-contract]
cmd = '''python -B .github/ci/verify_file_contract.py --manifest=.github/ci/check-matrix.yml --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --purpose='{{ purpose | replace("'", "'\"'\"'") }}' --path='{{ path | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --tarball-sha256='{{ tarball_sha256 | replace("'", "'\"'\"'") }}' --output='{{ output | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["environment_id", "purpose", "path", "source_sha", "event_sha", "tarball_sha256", "output"]

[tasks.ci-run-vnu]
cmd = '''python -B .github/ci/run_vnu.py --manifest=.github/ci/check-matrix.yml --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --dispatcher='{{ dispatcher | replace("'", "'\"'\"'") }}' --r-executable='{{ r_executable | replace("'", "'\"'\"'") }}' --tarball='{{ tarball | replace("'", "'\"'\"'") }}' --metadata='{{ metadata | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --tarball-sha256='{{ tarball_sha256 | replace("'", "'\"'\"'") }}' --work-dir='{{ work_dir | replace("'", "'\"'\"'") }}' --library='{{ library | replace("'", "'\"'\"'") }}' --file-evidence='{{ file_evidence | replace("'", "'\"'\"'") }}' --output='{{ output | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["environment_id", "dispatcher", "r_executable", "tarball", "metadata", "source_sha", "event_sha", "tarball_sha256", "work_dir", "library", "file_evidence", "output"]

[tasks.ci-verify-mkl]
cmd = '''python -B .github/ci/run_r_helper.py --r-executable='{{ r_executable | replace("'", "'\"'\"'") }}' --helper=verify-mkl -- --policy='{{ policy | replace("'", "'\"'\"'") }}' --evidence='{{ evidence | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["r_executable", "policy", "evidence"]
env = { LC_ALL = "C", R_ENVIRON_USER = "{% if pixi.is_win %}NUL{% else %}/dev/null{% endif %}", R_PROFILE_USER = "{% if pixi.is_win %}NUL{% else %}/dev/null{% endif %}" }

[tasks.ci-unit]
cmd = '''python .github/ci/run_unit_driver.py --r-executable='{{ r_executable | replace("'", "'\"'\"'") }}' --package='{{ package | replace("'", "'\"'\"'") }}' --load-package='{{ mode | replace("'", "'\"'\"'") }}' --context='{{ runner_context | replace("'", "'\"'\"'") }}' --policy=.github/ci/check-policy.yml --output='{{ output | replace("'", "'\"'\"'") }}' {% if filter %}--filter='{{ filter | replace("'", "'\"'\"'") }}' {% endif %}'''
cwd = "."
args = ["mode", "output", "r_executable", "runner_context", { arg = "package", default = "." }, { arg = "filter", default = "" }]
env = { LC_ALL = "C", R_ENVIRON_USER = "{% if pixi.is_win %}NUL{% else %}/dev/null{% endif %}", R_PROFILE_USER = "{% if pixi.is_win %}NUL{% else %}/dev/null{% endif %}" }

[tasks.ci-check]
cmd = '''python .github/ci/run_driver.py --manifest=.github/ci/check-matrix.yml --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --driver='{{ driver | replace("'", "'\"'\"'") }}' --executable='{{ executable | replace("'", "'\"'\"'") }}' --tarball='{{ tarball | replace("'", "'\"'\"'") }}' --metadata='{{ metadata | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --evidence='{{ evidence | replace("'", "'\"'\"'") }}' {% if r_entrypoint %}--r-entrypoint='{{ r_entrypoint | replace("'", "'\"'\"'") }}' {% endif %}{% if required_r_executable %}--required-r-executable='{{ required_r_executable | replace("'", "'\"'\"'") }}' {% endif %}--'''
cwd = "."
args = [
  "environment_id",
  "driver",
  "executable",
  "tarball",
  "metadata",
  "source_sha",
  "event_sha",
  "evidence",
  { arg = "r_entrypoint", default = "" },
  { arg = "required_r_executable", default = "" },
]

[tasks.ci-host-docker]
cmd = '''python -B .github/ci/run_host_docker.py --image='{{ image | replace("'", "'\"'\"'") }}' {% if wrapper %}--wrapper='{{ wrapper | replace("'", "'\"'\"'") }}'{% endif %} {% if r_binary %}--r-binary='{{ r_binary | replace("'", "'\"'\"'") }}'{% endif %} {% if direct == "true" %}--direct{% endif %} --tarball='{{ tarball | replace("'", "'\"'\"'") }}' --metadata='{{ metadata | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --work-dir='{{ work_dir | replace("'", "'\"'\"'") }}' --result='{{ result | replace("'", "'\"'\"'") }}' --evidence='{{ evidence | replace("'", "'\"'\"'") }}' --user='{{ user | replace("'", "'\"'\"'") }}' {% if platform %}--platform='{{ platform | replace("'", "'\"'\"'") }}'{% endif %} {% if readonly_library %}--readonly-library='{{ readonly_library | replace("'", "'\"'\"'") }}'{% endif %} {% if runtime_proof %}--runtime-proof='{{ runtime_proof | replace("'", "'\"'\"'") }}'{% endif %}'''
cwd = "."
args = ["image", "tarball", "metadata", "source_sha", "event_sha", "environment_id", "work_dir", "result", "evidence", { arg = "wrapper", default = "" }, { arg = "user", default = "0:0" }, { arg = "platform", default = "" }, { arg = "readonly_library", default = "" }, { arg = "r_binary", default = "" }, { arg = "direct", default = "" }, { arg = "runtime_proof", default = "" }]

[tasks.ci-host-unit]
cmd = '''python -B .github/ci/run_host_unit.py --image='{{ image | replace("'", "'\"'\"'") }}' --package='{{ package | replace("'", "'\"'\"'") }}' --output='{{ output | replace("'", "'\"'\"'") }}' --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --policy='{{ policy | replace("'", "'\"'\"'") }}' --user='{{ user | replace("'", "'\"'\"'") }}' {% if platform %}--platform='{{ platform | replace("'", "'\"'\"'") }}'{% endif %} {% if runtime_proof %}--runtime-proof='{{ runtime_proof | replace("'", "'\"'\"'") }}'{% endif %}'''
cwd = "."
args = ["image", "package", "output", "environment_id", "policy", { arg = "user", default = "0:0" }, { arg = "platform", default = "" }, { arg = "runtime_proof", default = "" }]

[tasks.ci-native-check]
cmd = '''python -B .github/ci/run_native_check.py --manifest=.github/ci/check-matrix.yml --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --wrapper='{{ wrapper | replace("'", "'\"'\"'") }}' --required-r-executable='{{ r_executable | replace("'", "'\"'\"'") }}' --tarball='{{ tarball | replace("'", "'\"'\"'") }}' --metadata='{{ metadata | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --work-dir='{{ work_dir | replace("'", "'\"'\"'") }}' --check-library='{{ check_library | replace("'", "'\"'\"'") }}' --evidence='{{ evidence | replace("'", "'\"'\"'") }}' --log='{{ log | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["environment_id", "wrapper", "r_executable", "tarball", "metadata", "source_sha", "event_sha", "work_dir", "check_library", "evidence", "log"]

[tasks.ci-unit-result]
cmd = '''python -B .github/ci/adapt_unit_result.py --diagnostic='{{ diagnostic | replace("'", "'\"'\"'") }}' --manifest=.github/ci/check-matrix.yml --policy=.github/ci/check-policy.yml --output='{{ output | replace("'", "'\"'\"'") }}' --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --tarball-sha256='{{ tarball_sha256 | replace("'", "'\"'\"'") }}' {% if sidecar_1 %}--sidecar='{{ sidecar_1 | replace("'", "'\"'\"'") }}' {% endif %}{% if sidecar_2 %}--sidecar='{{ sidecar_2 | replace("'", "'\"'\"'") }}' {% endif %}'''
cwd = "."
args = ["diagnostic", "output", "environment_id", "source_sha", "event_sha", "tarball_sha256", { arg = "sidecar_1", default = "" }, { arg = "sidecar_2", default = "" }]

[tasks.ci-package-result]
cmd = '''python -B .github/ci/run_r_helper.py --r-executable='{{ r_executable | replace("'", "'\"'\"'") }}' --helper=parse-check -- --log='{{ log | replace("'", "'\"'\"'") }}' --reported-log-path='{{ reported_log_path | replace("'", "'\"'\"'") }}' --policy=.github/ci/check-policy.yml --output='{{ output | replace("'", "'\"'\"'") }}' --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --tarball-sha256='{{ tarball_sha256 | replace("'", "'\"'\"'") }}' --check-exit-code='{{ check_exit_code | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["r_executable", "log", "reported_log_path", "output", "environment_id", "source_sha", "event_sha", "tarball_sha256", "check_exit_code"]
env = { LC_ALL = "C", R_ENVIRON_USER = "{% if pixi.is_win %}NUL{% else %}/dev/null{% endif %}", R_PROFILE_USER = "{% if pixi.is_win %}NUL{% else %}/dev/null{% endif %}" }

[tasks.ci-finalize-result]
cmd = '''python -B .github/ci/finalize_result.py --result='{{ result | replace("'", "'\"'\"'") }}' --expected-kind='{{ expected_kind | replace("'", "'\"'\"'") }}' --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --tarball-sha256='{{ tarball_sha256 | replace("'", "'\"'\"'") }}' --job-status='{{ job_status | replace("'", "'\"'\"'") }}' --producer-outcome='{{ producer_outcome | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["result", "expected_kind", "environment_id", "source_sha", "event_sha", "tarball_sha256", "job_status", "producer_outcome"]

[tasks.ci-summary]
cmd = '''python .github/ci/aggregate_results.py --manifest='{{ manifest | replace("'", "'\"'\"'") }}' --results-root='{{ results_root | replace("'", "'\"'\"'") }}' --expected-source-sha='{{ expected_source_sha | replace("'", "'\"'\"'") }}' --expected-event-sha='{{ expected_event_sha | replace("'", "'\"'\"'") }}' --expected-tarball-sha256='{{ expected_tarball_sha256 | replace("'", "'\"'\"'") }}' --summary='{{ summary | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = [
  "manifest",
  "results_root",
  "expected_source_sha",
  "expected_event_sha",
  "expected_tarball_sha256",
  "summary",
]

[feature.local-r44]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[feature.local-r44.dependencies]
pandoc = "*"
r-base = "4.4.*"
r-testthat = "*"
r-devtools = "*"
r-rcmdcheck = "*"
r-jsonlite = "*"
r-rfast = "*"
r-matrixstats = "*"
r-knitr = "*"
r-rmarkdown = "*"
r-ashr = "*"
r-mass = "*"
r-susier = "*"
r-yaml = "*"
r-v8 = "*"
r-tinytex = "*"
tidy-html5 = "*"

[feature.local-r44.tasks]
test = { cmd = "Rscript --vanilla .github/ci/run-unit-tests.R --package=. --load-package=source --context=local-r44 --policy=.github/ci/check-policy.yml --output=.pixi/local-r44/unit-results.json", cwd = ".", env = { LC_ALL = "C", R_ENVIRON_USER = "/dev/null", R_PROFILE_USER = "/dev/null", R_LIBS_USER = "$CONDA_PREFIX/lib/R/library" } }
check = { cmd = "Rscript --vanilla .github/ci/run-local-check.R", cwd = ".", env = { LC_ALL = "C", R_ENVIRON_USER = "/dev/null", R_PROFILE_USER = "/dev/null", R_LIBS_USER = "$CONDA_PREFIX/lib/R/library" } }
ci-r-contract-tests = { cmd = "Rscript --vanilla .github/ci/tests/test-unit-policy.R", cwd = ".", env = { LC_ALL = "C", R_ENVIRON_USER = "/dev/null", R_PROFILE_USER = "/dev/null", R_LIBS_USER = "$CONDA_PREFIX/lib/R/library" } }

[feature.local-r45]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[feature.local-r45.dependencies]
pandoc = "*"
r-base = "4.5.*"
r-testthat = "*"
r-devtools = "*"
r-rcmdcheck = "*"
r-jsonlite = "*"
r-rfast = "*"
r-matrixstats = "*"
r-knitr = "*"
r-rmarkdown = "*"
r-ashr = "*"
r-mass = "*"
r-susier = "*"
r-yaml = "*"
r-v8 = "*"
r-tinytex = "*"
tidy-html5 = "*"

[feature.local-r45.tasks]
test = { cmd = "Rscript --vanilla .github/ci/run-unit-tests.R --package=. --load-package=source --context=local-r45 --policy=.github/ci/check-policy.yml --output=.pixi/local-r45/unit-results.json", cwd = ".", env = { LC_ALL = "C", R_ENVIRON_USER = "/dev/null", R_PROFILE_USER = "/dev/null", R_LIBS_USER = "$CONDA_PREFIX/lib/R/library" } }
check = { cmd = "Rscript --vanilla .github/ci/run-local-check.R", cwd = ".", env = { LC_ALL = "C", R_ENVIRON_USER = "/dev/null", R_PROFILE_USER = "/dev/null", R_LIBS_USER = "$CONDA_PREFIX/lib/R/library" } }
ci-r-contract-tests = { cmd = "Rscript --vanilla .github/ci/tests/test-unit-policy.R", cwd = ".", env = { LC_ALL = "C", R_ENVIRON_USER = "/dev/null", R_PROFILE_USER = "/dev/null", R_LIBS_USER = "$CONDA_PREFIX/lib/R/library" } }

[environments]
local-r44 = { features = ["local-r44"] }
local-r45 = { features = ["local-r45"] }
