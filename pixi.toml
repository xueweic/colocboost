[workspace]
name = "colocboost-ci"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[system-requirements]
libc = { family = "glibc", version = "2.17" }

[dependencies]
python = "3.12.*"
pyyaml = "*"
jsonschema = "*"
pytest = "*"

[target.linux-64.dependencies]
jq = "*"
coreutils = "*"

[target.linux-aarch64.dependencies]
jq = "*"
coreutils = "*"

[target.osx-64.dependencies]
jq = "*"
coreutils = "*"

[target.osx-arm64.dependencies]
jq = "*"
coreutils = "*"

[tasks.ci-validate]
cmd = "python .github/ci/validate_manifest.py .github/ci/check-matrix.yml"
cwd = "."

[tasks.ci-contract-tests]
cmd = "python -B .github/ci/run-contract-tests.py"
cwd = "."
env = { PYTHONDONTWRITEBYTECODE = "1" }

[tasks.ci-prepare]
cmd = '''python .github/ci/artifact_contract.py create --tarball='{{ tarball | replace("'", "'\"'\"'") }}' --metadata='{{ metadata | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["tarball", "metadata", "source_sha", "event_sha"]

[tasks.ci-prepare-source]
cmd = '''python -B .github/ci/prepare_source.py --repository='{{ repository | replace("'", "'\"'\"'") }}' --output-dir='{{ output_dir | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --github-output='{{ github_output | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["repository", "output_dir", "event_sha", "github_output"]
env = { LC_ALL = "C", R_ENVIRON_USER = "/dev/null", R_PROFILE_USER = "/dev/null", R_LIBS_USER = "$CONDA_PREFIX/lib/R/library" }

[tasks.ci-verify-source]
cmd = '''python -B .github/ci/verify_source.py --source-dir='{{ source_dir | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --github-output='{{ github_output | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["source_dir", "source_sha", "event_sha", "github_output"]

[tasks.ci-unit]
cmd = '''python .github/ci/run_unit_driver.py --r-executable='{{ r_executable | replace("'", "'\"'\"'") }}' --package=. --load-package='{{ mode | replace("'", "'\"'\"'") }}' --context='{{ runner_context | replace("'", "'\"'\"'") }}' --policy=.github/ci/check-policy.yml --output='{{ output | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = ["mode", "output", "r_executable", "runner_context"]
env = { LC_ALL = "C", R_ENVIRON_USER = "{% if pixi.is_win %}NUL{% else %}/dev/null{% endif %}", R_PROFILE_USER = "{% if pixi.is_win %}NUL{% else %}/dev/null{% endif %}" }

[tasks.ci-check]
cmd = '''python .github/ci/run_driver.py --manifest=.github/ci/check-matrix.yml --environment-id='{{ environment_id | replace("'", "'\"'\"'") }}' --driver='{{ driver | replace("'", "'\"'\"'") }}' --executable='{{ executable | replace("'", "'\"'\"'") }}' --tarball='{{ tarball | replace("'", "'\"'\"'") }}' --metadata='{{ metadata | replace("'", "'\"'\"'") }}' --source-sha='{{ source_sha | replace("'", "'\"'\"'") }}' --event-sha='{{ event_sha | replace("'", "'\"'\"'") }}' --evidence='{{ evidence | replace("'", "'\"'\"'") }}' {% if r_entrypoint %}--r-entrypoint='{{ r_entrypoint | replace("'", "'\"'\"'") }}' {% endif %}--'''
cwd = "."
args = [
  "environment_id",
  "driver",
  "executable",
  "tarball",
  "metadata",
  "source_sha",
  "event_sha",
  "evidence",
  { arg = "r_entrypoint", default = "" },
]

[tasks.ci-summary]
cmd = '''python .github/ci/aggregate_results.py --manifest='{{ manifest | replace("'", "'\"'\"'") }}' --results-root='{{ results_root | replace("'", "'\"'\"'") }}' --expected-source-sha='{{ expected_source_sha | replace("'", "'\"'\"'") }}' --expected-event-sha='{{ expected_event_sha | replace("'", "'\"'\"'") }}' --expected-tarball-sha256='{{ expected_tarball_sha256 | replace("'", "'\"'\"'") }}' --summary='{{ summary | replace("'", "'\"'\"'") }}' '''
cwd = "."
args = [
  "manifest",
  "results_root",
  "expected_source_sha",
  "expected_event_sha",
  "expected_tarball_sha256",
  "summary",
]

[feature.local-r44]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[feature.local-r44.dependencies]
pandoc = "*"
r-base = "4.4.*"
r-testthat = "*"
r-devtools = "*"
r-rcmdcheck = "*"
r-jsonlite = "*"
r-rfast = "*"
r-matrixstats = "*"
r-knitr = "*"
r-rmarkdown = "*"
r-ashr = "*"
r-mass = "*"
r-susier = "*"
r-yaml = "*"

[feature.local-r44.tasks]
test = { cmd = "Rscript --vanilla .github/ci/run-unit-tests.R --package=. --load-package=source --context=local-r44 --policy=.github/ci/check-policy.yml --output=.pixi/local-r44/unit-results.json", cwd = ".", env = { LC_ALL = "C", R_ENVIRON_USER = "/dev/null", R_PROFILE_USER = "/dev/null", R_LIBS_USER = "$CONDA_PREFIX/lib/R/library" } }
check = { cmd = "Rscript --vanilla .github/ci/run-local-check.R", cwd = ".", env = { LC_ALL = "C", R_ENVIRON_USER = "/dev/null", R_PROFILE_USER = "/dev/null", R_LIBS_USER = "$CONDA_PREFIX/lib/R/library" } }
ci-r-contract-tests = { cmd = "Rscript --vanilla .github/ci/tests/test-unit-policy.R", cwd = ".", env = { LC_ALL = "C", R_ENVIRON_USER = "/dev/null", R_PROFILE_USER = "/dev/null", R_LIBS_USER = "$CONDA_PREFIX/lib/R/library" } }

[feature.local-r45]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[feature.local-r45.dependencies]
pandoc = "*"
r-base = "4.5.*"
r-testthat = "*"
r-devtools = "*"
r-rcmdcheck = "*"
r-jsonlite = "*"
r-rfast = "*"
r-matrixstats = "*"
r-knitr = "*"
r-rmarkdown = "*"
r-ashr = "*"
r-mass = "*"
r-susier = "*"
r-yaml = "*"

[feature.local-r45.tasks]
test = { cmd = "Rscript --vanilla .github/ci/run-unit-tests.R --package=. --load-package=source --context=local-r45 --policy=.github/ci/check-policy.yml --output=.pixi/local-r45/unit-results.json", cwd = ".", env = { LC_ALL = "C", R_ENVIRON_USER = "/dev/null", R_PROFILE_USER = "/dev/null", R_LIBS_USER = "$CONDA_PREFIX/lib/R/library" } }
check = { cmd = "Rscript --vanilla .github/ci/run-local-check.R", cwd = ".", env = { LC_ALL = "C", R_ENVIRON_USER = "/dev/null", R_PROFILE_USER = "/dev/null", R_LIBS_USER = "$CONDA_PREFIX/lib/R/library" } }
ci-r-contract-tests = { cmd = "Rscript --vanilla .github/ci/tests/test-unit-policy.R", cwd = ".", env = { LC_ALL = "C", R_ENVIRON_USER = "/dev/null", R_PROFILE_USER = "/dev/null", R_LIBS_USER = "$CONDA_PREFIX/lib/R/library" } }

[environments]
local-r44 = { features = ["local-r44"] }
local-r45 = { features = ["local-r45"] }
