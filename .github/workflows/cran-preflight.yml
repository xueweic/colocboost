            "$VERIFY_SOURCE_OUTCOME" "$WRAPPER_OUTCOME" "$PREP_OUTCOME" \
            "$DEPENDENCY_PROOF_OUTCOME" "$NATIVE_CHECK_OUTCOME"; do
            test "$value" = success
          done

      - name: Finalize noSuggests unit result
        id: finalize-unit
        if: ${{ always() }}
        continue-on-error: true
        env:
          TARBALL_SHA256: ${{ steps.verify-source.outputs.tarball_sha256 || env.FALLBACK_TARBALL_SHA256 }}
          JOB_STATUS: ${{ job.status }}
