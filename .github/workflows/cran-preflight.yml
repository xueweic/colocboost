          CHECK_FINALIZER_OUTCOME: ${{ steps.finalize-check.outcome }}
          UNIT_UPLOAD_OUTCOME: ${{ steps.upload-unit.outcome }}
          CHECK_UPLOAD_OUTCOME: ${{ steps.upload-check.outcome }}
