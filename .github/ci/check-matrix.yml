    wrapper_sha256: a42092f0de63c4a9c1bed3c1c9b341b32c51f72335169d02732318c102646090
    system_r: /opt/R/devel/bin/R
    wrapper_input: tarball-parent
    check_args: [--no-manual, --no-build-vignettes]
    runtime_profile: clang22
    expected_r_kind: devel
    expected_os: linux
    expected_architecture: x86_64
    expected_distribution: ubuntu
    expected_distribution_version: "22.04"
    proof: [source-tarball-sha256, container-system-r, r-executable, r-version, r-devel-revision, operating-system, compiler, clang-22, flang-22, libcxx, architecture, locale]
    limitation: Ubuntu and libc++ proxy the CRAN Debian testing environment; no active exact Debian/Clang CRAN image exists.

