numerical_backends:
  mkl:
    required_library_patterns:
      - '(?i)(?:^|/)libmkl_intel_lp64(?:\.so(?:\.\d+)*)?(?:$|\s)'
      - '(?i)(?:^|/)libmkl_core(?:\.so(?:\.\d+)*)?(?:$|\s)'
      - '(?i)(?:^|/)libmkl_sequential(?:\.so(?:\.\d+)*)?(?:$|\s)'
    forbidden_library_patterns:
      - '(?i)(?:^|/)libmkl_(?:intel|gnu|tbb)_thread(?:\.so(?:\.\d+)*)?(?:$|\s)'
      - '(?i)(?:^|/)libopenblas(?:\.so(?:\.\d+)*)?(?:$|\s)'
      - '(?i)(?:^|/)lib(?:s?atlas)(?:\.so(?:\.\d+)*)?(?:$|\s)'
      - '(?i)(?:^|/)libblis(?:\.so(?:\.\d+)*)?(?:$|\s)'
